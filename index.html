
<!DOCTYPE html>
<html>
  <head>
    <!-- Makes webpage respond to different screen sizes-->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Brings in MindAR and AFrame libraries- to detect items and create AR objects-->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- Makes the camera fill the screen and stops the webpage from scroling -->
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      a-scene {
        width: 100%;
        height: 100vh;
      }
    </style>

  </head>

  <body>
    <!-- Sets up AR to look for object in targets.mind file -->
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind"
      embedded
      color-space="sRGB"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <!-- Loads the image that will appear when target is detected (your-ar-image.png) -->
      <a-assets>
        <img id="secret-image" src="./your-ar-image.png">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Checks for when the target is detected-->
      <a-entity mindar-image-target="targetIndex: 0">

        <!-- Creates a new AR object of our image -->
        <a-image
          src="#secret-image"
          position="0 0 0"
          height="0.552"
          width="1">
        </a-image>

      </a-entity>

    </a-scene>

  </body>
</html>
