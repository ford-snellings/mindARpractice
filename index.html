
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>My AR Experience</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- MindAR A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      background: black;
    }

    body {
      overscroll-behavior: none;
    }

    a-scene {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100vh !important;
      height: 100dvh !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
    }

    a-scene canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }

    video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    .a-enter-vr,
    .a-enter-ar {
      display: none !important;
    }

  </style>

  <script>

    // Debug image tracking

    AFRAME.registerComponent('target-debug', {

      init: function () {

        this.el.addEventListener('targetFound', function () {
          console.log('IMAGE TARGET FOUND');
        });

        this.el.addEventListener('targetLost', function () {
          console.log('IMAGE TARGET LOST');
        });

      }

    });

  </script>

</head>

<body>

  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      maxTrack: 1;
      warmupTolerance: 5;
      missTolerance: 10;
      filterMinCF: 0.0001;
      filterBeta: 0.01;
    "

    embedded

    color-space="sRGB"

    renderer="colorManagement: true; precision: mediump"

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

  >

    <!-- ASSETS -->

    <a-assets>

      <img
        id="secret-image"
        src="./your-ar-image.png"
        crossorigin="anonymous"
      >

    </a-assets>


    <!-- CAMERA -->

    <a-camera

      position="0 0 0"

      look-controls="enabled: false"

    ></a-camera>


    <!-- IMAGE TARGET -->

    <a-entity

      mindar-image-target="targetIndex: 0"

      target-debug

    >

      <!-- AR OVERLAY -->

      <a-plane

        src="#secret-image"

        position="0 0 0.01"

        width="1"

        height="0.552"

        material="
          transparent: true;
          shader: flat;
          side: double
        "

      ></a-plane>

    </a-entity>

  </a-scene>

</body>

</html>
