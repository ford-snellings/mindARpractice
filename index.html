
<!DOCTYPE html>
<html>
  <head>
    <!-- Makes webpage respond to different screen sizes-->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Brings in MindAR and AFrame libraries- to detect items and create AR objects-->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- Makes the camera fill the screen and stops the webpage from scroling -->
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      a-scene {
        width: 100%;
        height: 100vh;
      }

      #overlay {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 70%;
        opacity: 0.4;
        z-index: 10;
        pointer-events: none;
      }
    </style>

  </head>

  <body>
    <img id="overlay" src="./target-image.png">
    
    <!-- Sets up AR to look for object in targets.mind file -->
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind"
      embedded
      color-space="sRGB"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <!-- Loads the image that will appear when target is detected (your-ar-image.png) -->
      <a-assets>
        <img id="secret-image" src="./your-ar-image.png">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Checks for when the target is detected-->
      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <a-image
        id="ar-image"
        src="#secret-image"
        position="0 0 0"
        height="0.552"
        width="1"
        visible="false">
        </a-image>
      </a-entity>
        <!-- Creates a new AR object of our image -->
      

    </a-scene>
  <script>
    const target = document.querySelector("#target");
    const arImage = document.querySelector("#ar-image");

    // Detect when image is first recognized
    target.addEventListener("targetFound", function() => {

      // Make AR image visible
      arImage.setAttribute("visible", true);

      target.removeAttribute("mindar-image-target");

    });
  </script>
  </body>
</html>
